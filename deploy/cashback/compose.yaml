services:
  cashback-control:
    image: ghcr.io/srobroek/finance-statement-tracker-cashback-control:main
    pull_policy: always
    container_name: finance-cashback-control
    restart: unless-stopped
    env_file:
      - /opt/stacks/finance-runtime/.env
    environment:
      TZ: Asia/Dubai
      CASHBACK_PROGRAM_CONFIG_PATH: /etc/cashback/profile.json
      ACTUAL_BOOTSTRAP_CONFIG_PATH: /etc/cashback/actual-bootstrap.json
      STATIC_RULES_CONFIG_PATH: /etc/cashback/static-rules.json
      TRANSACTION_EMAIL_SOURCES_PATH: /etc/cashback/transaction-email-sources.json
      CASHBACK_REFRESH_SECONDS: "60"
      CASHBACK_STALE_AFTER_MINUTES: "1560"
    security_opt:
      - no-new-privileges:true
    ports:
      # Cloudflare Tunnel is the only public entry point; keep the origin off the LAN.
      - "127.0.0.1:5010:5010"
    volumes:
      - ${CASHBACK_DATA_DIR:-./data}:/var/lib/cashback-control
      - ./cashback-profile.json:/etc/cashback/profile.json:ro
      - ./actual-bootstrap.json:/etc/cashback/actual-bootstrap.json:ro
      - ./static-rules.json:/etc/cashback/static-rules.json:ro
      - ./transaction-email-sources.json:/etc/cashback/transaction-email-sources.json:ro
    healthcheck:
      test: ["CMD", "python", "apps/cashback-control/probe_health.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
