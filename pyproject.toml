[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-statement-worker"
version = "0.1.0"
description = "Platform-neutral deterministic statement, rule, evidence, and cashback worker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
statements = [
    "pdfplumber==0.11.9",
    "pypdf==6.10.0",
]
test = [
    "reportlab==4.4.9",
]

[project.scripts]
finance-worker = "finance_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["finance_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
