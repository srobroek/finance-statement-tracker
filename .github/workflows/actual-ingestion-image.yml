name: Actual ingestion container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/actual-ingestion-image.yml"
      - ".dockerignore"
      - "apps/actual-ingestion/**"
      - "browser_adapters/**"
      - "config/**"
      - "deploy/actual-poc/backup.sh"
      - "deploy/actual-poc/verify-backup.py"
      - "deploy/actual-poc/finance-backup.service"
      - "deploy/actual-poc/finance-backup.timer"
      - "deploy/finance-monitor/**"
      - "deploy/ingestion/**"
      - "deploy/finance-runtime/**"
      - "finance_tracker/**"
      - "integrations/actual/**"
      - "pyproject.toml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: actual-ingestion-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finance-statement-tracker-actual-ingestion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install ".[statements,test]"

      - name: Run Python regression suite
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/actual/package-lock.json

      - name: Install Actual bridge
        working-directory: integrations/actual
        run: npm ci

      - name: Test Actual bridge
        working-directory: integrations/actual
        run: npm test

      - name: Run offline Actual integration
        working-directory: integrations/actual
        run: npm run integration

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/actual-ingestion/Dockerfile
          build-args: |
            FINANCE_PIPELINE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on:
      - self-hosted
      - finance-ci
    steps:
      - name: Fetch exact deployment source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/finance-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$source_dir" in
            "$RUNNER_TEMP"/finance-deploy-*) ;;
            *) echo "Unsafe deployment source path: $source_dir" >&2; exit 1 ;;
          esac
          rm -rf -- "$source_dir"
          install -d "$source_dir"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$source_dir" init -q
          git -C "$source_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$source_dir" -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'DEPLOY_SOURCE=%s\n' "$source_dir" >> "$GITHUB_ENV"

      - name: Prepare persistent state and Dockge configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          stack=/opt/stacks/finance-ingestion
          state=/opt/stacks/finance-actual-poc/ingestion-data
          sudo install -d "$stack"
          sudo install -d /opt/stacks/finance-actual-poc
          sudo install -d -m 0700 /opt/stacks/finance-runtime
          sudo install -m 0600 deploy/finance-runtime/finance.env.tpl /opt/stacks/finance-runtime/.env.tpl
          sudo install -m 0750 deploy/finance-runtime/render-env.sh /opt/stacks/finance-runtime/render-env.sh
          sudo /opt/stacks/finance-runtime/render-env.sh
          sudo install -m 0750 deploy/actual-poc/backup.sh /opt/stacks/finance-actual-poc/backup.sh
          sudo install -m 0750 deploy/actual-poc/verify-backup.py /opt/stacks/finance-actual-poc/verify-backup.py
          sudo install -m 0644 deploy/actual-poc/finance-backup.service /etc/systemd/system/finance-backup.service
          sudo install -m 0644 deploy/actual-poc/finance-backup.timer /etc/systemd/system/finance-backup.timer
          sudo install -m 0750 deploy/finance-monitor/finance-health-monitor.sh /usr/local/sbin/finance-health-monitor
          sudo install -m 0644 deploy/finance-monitor/finance-health-monitor.service /etc/systemd/system/finance-health-monitor.service
          sudo install -m 0644 deploy/finance-monitor/finance-health-monitor.timer /etc/systemd/system/finance-health-monitor.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now finance-backup.timer
          sudo systemctl enable --now finance-health-monitor.timer
          sudo install -d -o 10002 -g 10002 \
            "$state" \
            "$state/inbox" \
            "$state/jobs" \
            "$state/actual-cache"

      - name: Authenticate and pull tested image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          auth_file=/root/.config/containers/finance-ghcr-auth.json
          sudo mkdir -p "$(dirname "$auth_file")"
          printf '%s' "$GHCR_TOKEN" | sudo podman login \
            --authfile "$auth_file" \
            ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          sudo podman pull --authfile "$auth_file" "$IMAGE_NAME:main"
          sudo install -m 0644 deploy/ingestion/compose.yaml /opt/stacks/finance-ingestion/compose.yaml
          cd /opt/stacks/finance-ingestion
          # This project owns only the worker. It cannot recreate Actual,
          # Nginx, or the independent cashback service.
          sudo podman rm -f finance-actual-ingestion 2>/dev/null || true
          sudo docker compose -p finance-ingestion up -d --pull never actual-ingestion
          sudo podman logout --authfile "$auth_file" ghcr.io
          sudo rm -f "$auth_file"

      - name: Verify live deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5020/api/health | grep -q '"status": "ok"'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo docker compose -p finance-ingestion \
                -f /opt/stacks/finance-ingestion/compose.yaml logs --tail=100 actual-ingestion
              exit 1
            fi
            sleep 2
          done
          image="$(sudo docker inspect finance-actual-ingestion --format '{{.Config.Image}}')"
          test "$image" = "$IMAGE_NAME:main"
          health="$(curl -fsS http://127.0.0.1:5020/api/health)"
          expected_writes="$(sudo awk -F= '$1 == "ALLOW_ACTUAL_WRITES" { print tolower($2) }' /opt/stacks/finance-runtime/.env | tail -n1)"
          expected_writes="${expected_writes:-false}"
          grep -q "\"actual_writes_enabled\": $expected_writes" <<<"$health"
          grep -q "\"pipeline_revision\": \"$GITHUB_SHA\"" <<<"$health"
          grep -q 'RAK_WORLD' <<<"$health"
          grep -q 'SC_PLATINUM_X' <<<"$health"
          # A worker deploy must leave Actual's public origin untouched.
          headers="$(curl -fsSI http://127.0.0.1:5006/)"
          grep -qi '^Cross-Origin-Embedder-Policy: require-corp' <<<"$headers"
          grep -qi '^Cross-Origin-Opener-Policy: same-origin' <<<"$headers"

      - name: Exercise live statement and browser staging
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          stack=/opt/stacks/finance-actual-poc
          inbox="$stack/ingestion-data/inbox"
          base64 --decode tests/fixtures/synthetic-ei-statement.pdf.b64 | \
            sudo tee "$inbox/ci-synthetic-ei.pdf" >/dev/null
          sudo install -m 0644 tests/fixtures/browser-capture.sample.json \
            "$inbox/ci-browser-capture.json"

          statement_request='{"type":"STATEMENT_PDF","actual_mode":"STAGE","source_path":"ci-synthetic-ei.pdf","card_code":"EI_AMAZON","source_message_id":"ci-outlook-message","source_attachment_id":"ci-outlook-attachment","source_filename":"EI statement July 2026.pdf"}'
          statement_result="$(printf '%s' "$statement_request" | sudo docker exec -i finance-actual-ingestion python3 /app/apps/actual-ingestion/submit_local.py)"
          grep -q '"status": "STAGED"' <<<"$statement_result"
          grep -q '"envelope_count": 1' <<<"$statement_result"
          grep -q '"ai_request_count": 0' <<<"$statement_result"

          replay_result="$(printf '%s' "$statement_request" | sudo docker exec -i finance-actual-ingestion python3 /app/apps/actual-ingestion/submit_local.py)"
          grep -q '"idempotent_replay": true' <<<"$replay_result"

          browser_request='{"type":"BROWSER_CAPTURE","actual_mode":"STAGE","source_path":"ci-browser-capture.json"}'
          browser_result="$(printf '%s' "$browser_request" | sudo docker exec -i finance-actual-ingestion python3 /app/apps/actual-ingestion/submit_local.py)"
          grep -q '"status": "STAGED"' <<<"$browser_result"
          grep -q '"envelope_count":' <<<"$browser_result"
          grep -q '"ai_request_count": 1' <<<"$browser_result"

          ai_request="$(python3 -c '
          import json, sys
          result = json.load(sys.stdin)
          request = next(
              item for item in result["ai_handoff"]["requests"]
              if item["policy_id"] == "classify-unresolved"
              and "tags" in item["allowed_fields"]
          )
          print(json.dumps({
              "type": "BROWSER_CAPTURE",
              "actual_mode": "STAGE",
              "source_path": "ci-browser-capture.json",
              "ai_handoff_complete": True,
              "ai_responses": [{
                  "transaction_id": request["transaction_id"],
                  "policy_id": request["policy_id"],
                  "provider": "github-actions-e2e",
                  "model": "synthetic",
                  "proposals": [{
                      "field": "tags",
                      "value": ["gift"],
                      "confidence": 0.95,
                      "rationale": "Synthetic policy handoff test",
                      "source_refs": ["ci-browser-capture"],
                  }],
              }],
          }))
          ' <<<"$browser_result")"
          ai_result="$(printf '%s' "$ai_request" | sudo docker exec -i finance-actual-ingestion python3 /app/apps/actual-ingestion/submit_local.py)"
          grep -q '"ai_response_count": 1' <<<"$ai_result"
          grep -q '"ai_accepted_count": 1' <<<"$ai_result"
          grep -q '"ai_rejected_count": 0' <<<"$ai_result"

          evidence_request="$(python3 -c '
          import json, sys
          result = json.load(sys.stdin)
          transaction_id = result["ai_handoff"]["requests"][0]["transaction_id"]
          print(json.dumps({
              "type": "BROWSER_CAPTURE",
              "actual_mode": "STAGE",
              "source_path": "ci-browser-capture.json",
              "evidence_links": [{
                  "transaction_id": transaction_id,
                  "evidence_id": "sha256:" + "e" * 64,
                  "relative_path": "Finance Evidence/2099/01/ci/ci-evidence.txt",
                  "document_type": "receipt",
              }],
          }))
          ' <<<"$browser_result")"
          evidence_result="$(printf '%s' "$evidence_request" | sudo docker exec -i finance-actual-ingestion python3 /app/apps/actual-ingestion/submit_local.py)"
          grep -q '"evidence_link_count": 1' <<<"$evidence_result"
          grep -q '"result_schema_version": 5' <<<"$evidence_result"
          evidence_manifest="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["manifest_path"])' <<<"$evidence_result")"
          sudo docker exec finance-actual-ingestion \
            grep -Fq 'evidence:Finance Evidence/2099/01/ci/ci-evidence.txt' "$evidence_manifest"

          placeholder_request='{"type":"STATEMENT_PDF","actual_mode":"STAGE","source_path":"ci-synthetic-ei.pdf","card_code":"RAK_WORLD"}'
          if placeholder_error="$(printf '%s' "$placeholder_request" | sudo docker exec -i finance-actual-ingestion python3 /app/apps/actual-ingestion/submit_local.py 2>&1)"; then
            echo 'Placeholder statement adapter unexpectedly accepted a statement' >&2
            exit 1
          fi
          grep -qi 'placeholder' <<<"$placeholder_error"

          # Deployment smoke tests never submit COMMIT jobs. Production write
          # enablement is verified through health plus an authenticated,
          # read-only Actual doctor check during the controlled promotion.
