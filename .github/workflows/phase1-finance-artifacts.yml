name: Phase 1 finance artifacts

on:
  pull_request:
    paths:
      - "packages/n8n-nodes-finance/**"
      - "services/pdf-utility/**"
      - "services/codex-agent-runner/**"
      - "services/n8n-task-runners/**"
      - "tests/test_n8n_task_runners_image.py"
      - "services/cloudflared/**"
      - "config/ai-policies.json"
      - "integrations/n8n/contracts/ai-proposal-v1.schema.json"
      - "integrations/n8n/generated/ai-policy-contracts.seed.json"
      - ".github/workflows/phase1-finance-artifacts.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "packages/n8n-nodes-finance/**"
      - "services/pdf-utility/**"
      - "services/codex-agent-runner/**"
      - "services/n8n-task-runners/**"
      - "tests/test_n8n_task_runners_image.py"
      - "services/cloudflared/**"
      - "config/ai-policies.json"
      - "integrations/n8n/contracts/ai-proposal-v1.schema.json"
      - "integrations/n8n/generated/ai-policy-contracts.seed.json"
      - ".github/workflows/phase1-finance-artifacts.yml"

permissions:
  contents: read
  packages: write

jobs:
  custom-nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/n8n-nodes-finance/package-lock.json
      - name: Install locked node package
        working-directory: packages/n8n-nodes-finance
        run: npm ci
      - name: Test and audit node package
        working-directory: packages/n8n-nodes-finance
        run: |
          npm test
          npm audit --audit-level=high
          npm pack --dry-run
      - name: Build exact custom n8n image
        run: docker build --file packages/n8n-nodes-finance/Dockerfile.n8n --tag finance-n8n:${{ github.sha }} .
      - name: Smoke custom node image
        run: |
          test "$(docker run --rm --entrypoint n8n finance-n8n:${{ github.sha }} --version)" = "2.36.2"
          docker run --rm --entrypoint node finance-n8n:${{ github.sha }} -e "const p=require('/home/node/.n8n/nodes/node_modules/n8n-nodes-finance/package.json'); if(p.version!=='0.1.0') process.exit(1); require('/home/node/.n8n/nodes/node_modules/n8n-nodes-finance/dist/nodes/ActualBudget/ActualBudget.node.js'); require('/home/node/.n8n/nodes/node_modules/n8n-nodes-finance/dist/nodes/FinancePdf/FinancePdf.node.js');"
          docker run --rm --entrypoint node finance-n8n:${{ github.sha }} -e "const n=require('/usr/local/lib/node_modules/n8n/node_modules/nodemailer'); const p=require('/usr/local/lib/node_modules/n8n/node_modules/nodemailer/package.json'); if(p.version!=='9.0.1'||typeof n.createTransport({jsonTransport:true}).sendMail!=='function') process.exit(1);"
      - name: Scan custom n8n image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-n8n:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate custom n8n SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: finance-n8n:${{ github.sha }}
          artifact-name: finance-n8n-${{ github.sha }}.spdx.json
      - name: Publish immutable custom n8n candidate
        if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/finance-n8n:${{ github.sha }}"
          docker tag "finance-n8n:${{ github.sha }}" "$image"
          docker push "$image"
          immutable_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          test -n "$immutable_ref"
          jq -n --arg image "$image" --arg immutable_ref "$immutable_ref" --arg source_sha "${{ github.sha }}" '{schema_version:1,image:$image,immutable_ref:$immutable_ref,source_sha:$source_sha}' > finance-n8n-image-receipt.json
      - name: Upload custom n8n digest receipt
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finance-n8n-image-receipt-${{ github.sha }}
          path: finance-n8n-image-receipt.json
          if-no-files-found: error

  pdf-utility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pdf-utility/requirements.txt
      - name: Install pinned PDF dependencies
        working-directory: services/pdf-utility
        run: python -m pip install --requirement requirements.txt
      - name: Test PDF utility on Linux UDS
        working-directory: services/pdf-utility
        run: python -m unittest discover -s tests -v
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --requirement services/pdf-utility/requirements.txt --no-deps --disable-pip
      - name: Build PDF utility image
        run: docker build --tag finance-pdf-utility:${{ github.sha }} services/pdf-utility
      - name: Smoke sandbox and network denial
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=96m,mode=1770,uid=1000,gid=1000 --tmpfs /run/finance-pdf:size=4m,mode=0770,uid=1000,gid=1000 --entrypoint python finance-pdf-utility:${{ github.sha }} -m unittest discover -s /opt/finance-pdf/tests -v
          docker run --rm --network none --read-only --tmpfs /tmp:size=4m --entrypoint python finance-pdf-utility:${{ github.sha }} /opt/finance-pdf/tests/network_probe.py
      - name: Scan PDF utility image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-pdf-utility:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate PDF utility SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: finance-pdf-utility:${{ github.sha }}
          artifact-name: finance-pdf-utility-${{ github.sha }}.spdx.json
      - name: Publish immutable PDF utility candidate
        if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/finance-pdf-utility:${{ github.sha }}"
          docker tag "finance-pdf-utility:${{ github.sha }}" "$image"
          docker push "$image"
          immutable_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          test -n "$immutable_ref"
          jq -n --arg image "$image" --arg immutable_ref "$immutable_ref" --arg source_sha "${{ github.sha }}" '{schema_version:1,image:$image,immutable_ref:$immutable_ref,source_sha:$source_sha}' > finance-pdf-utility-image-receipt.json
      - name: Upload PDF utility digest receipt
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finance-pdf-utility-image-receipt-${{ github.sha }}
          path: finance-pdf-utility-image-receipt.json
          if-no-files-found: error

  codex-agent-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/codex-agent-runner/package-lock.json
      - name: Install and test bounded runner
        working-directory: services/codex-agent-runner
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
      - name: Build runner image
        run: docker build --file services/codex-agent-runner/Dockerfile --tag finance-codex-agent-runner:${{ github.sha }} .
      - name: Verify exact Codex CLI
        run: |
          test "$(docker run --rm --entrypoint codex finance-codex-agent-runner:${{ github.sha }} --version)" = "codex-cli 0.148.0"
          test "$(docker run --rm --entrypoint node finance-codex-agent-runner:${{ github.sha }} --version)" = "v22.23.2"
      - name: Scan runner image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-codex-agent-runner:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate runner SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: finance-codex-agent-runner:${{ github.sha }}
          artifact-name: finance-codex-agent-runner-${{ github.sha }}.spdx.json
      - name: Publish immutable Codex runner candidate
        if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/finance-codex-agent-runner:${{ github.sha }}"
          docker tag "finance-codex-agent-runner:${{ github.sha }}" "$image"
          docker push "$image"
          immutable_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          test -n "$immutable_ref"
          jq -n --arg image "$image" --arg immutable_ref "$immutable_ref" --arg source_sha "${{ github.sha }}" '{schema_version:1,image:$image,immutable_ref:$immutable_ref,source_sha:$source_sha}' > finance-codex-agent-runner-image-receipt.json
      - name: Upload Codex runner digest receipt
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finance-codex-agent-runner-image-receipt-${{ github.sha }}
          path: finance-codex-agent-runner-image-receipt.json
          if-no-files-found: error

  n8n-task-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout finance repository
        uses: actions/checkout@v5
      - name: Checkout exact n8n source
        uses: actions/checkout@v5
        with:
          repository: n8n-io/n8n
          ref: bc9090e8c61d0dc84aa85528e62142dfb7001243
          path: .upstream/n8n
          fetch-depth: 1
      - name: Checkout exact launcher source
        uses: actions/checkout@v5
        with:
          repository: n8n-io/task-runner-launcher
          ref: fad71fc0dab52a6b6558765d1431c7846cfd816f
          path: .upstream/task-runner-launcher
          fetch-depth: 1
      - name: Verify upstream commits and apply security-only patch
        shell: bash
        run: |
          test "$(git -C .upstream/n8n rev-parse HEAD)" = "bc9090e8c61d0dc84aa85528e62142dfb7001243"
          test "$(git -C .upstream/task-runner-launcher rev-parse HEAD)" = "fad71fc0dab52a6b6558765d1431c7846cfd816f"
          git -C .upstream/task-runner-launcher apply --check "$GITHUB_WORKSPACE/services/n8n-task-runners/launcher-x-text-0.39.0.patch"
          git -C .upstream/task-runner-launcher apply "$GITHUB_WORKSPACE/services/n8n-task-runners/launcher-x-text-0.39.0.patch"
          test "$(git -C .upstream/task-runner-launcher diff --name-only)" = $'go.mod\ngo.sum'
          grep -Fx $'\tgolang.org/x/text v0.39.0 // indirect' .upstream/task-runner-launcher/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
      - name: Build exact JavaScript runner dependency closure
        working-directory: .upstream/n8n
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter=@n8n/task-runner... build
          rm -rf dist/task-runner-javascript
          NODE_ENV=production DOCKER_BUILD=true pnpm --filter=@n8n/task-runner --prod --legacy deploy --no-optional dist/task-runner-javascript
          test "$(node -p "require('./dist/task-runner-javascript/package.json').version")" = "2.36.1"
          test -f dist/task-runner-javascript/dist/start.js
      - name: Build source-reproduced task runners image
        run: docker build --file services/n8n-task-runners/Dockerfile --tag finance-n8n-task-runners:${{ github.sha }} .
      - name: Smoke exact runtime and n8n broker protocol
        shell: bash
        run: |
          test "$(docker run --rm --entrypoint node finance-n8n-task-runners:${{ github.sha }} --version)" = "v24.18.1"
          docker run --rm --entrypoint /opt/runners/task-runner-python/.venv/bin/python finance-n8n-task-runners:${{ github.sha }} -I -B -X disable_remote_debug -c "import src.main, urllib3, websockets"
          docker run --rm --entrypoint python finance-n8n-task-runners:${{ github.sha }} -c "import importlib.metadata as m; names={d.metadata['Name'].lower() for d in m.distributions()}; assert not names.intersection({'pip','setuptools','msgpack'}), names"
          test "$(docker image inspect finance-n8n-task-runners:${{ github.sha }} --format '{{ index .Config.Labels \"finance.n8n.source_commit\" }}')" = "bc9090e8c61d0dc84aa85528e62142dfb7001243"
          sh services/n8n-task-runners/protocol-smoke.sh \
            finance-n8n-task-runners:${{ github.sha }} \
            ghcr.io/n8n-io/n8n:2.36.2@sha256:be13ef936c03ce0f2d58426afa06e7f1ba2a1d50e4f19ebf3e8488435bf5e386
      - name: Scan task runners image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-n8n-task-runners:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate task runners SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: finance-n8n-task-runners:${{ github.sha }}
          artifact-name: finance-n8n-task-runners-${{ github.sha }}.spdx.json
      - name: Publish immutable task runners candidate
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/finance-n8n-task-runners:${{ github.sha }}"
          docker tag "finance-n8n-task-runners:${{ github.sha }}" "$image"
          docker push "$image"
          immutable_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          test -n "$immutable_ref"
          jq -n \
            --arg image "$image" \
            --arg immutable_ref "$immutable_ref" \
            --arg source_sha "${{ github.sha }}" \
            --arg n8n_source_commit "bc9090e8c61d0dc84aa85528e62142dfb7001243" \
            --arg launcher_source_commit "fad71fc0dab52a6b6558765d1431c7846cfd816f" \
            '{schema_version:1,image:$image,immutable_ref:$immutable_ref,source_sha:$source_sha,n8n_source_commit:$n8n_source_commit,launcher_source_commit:$launcher_source_commit,security_overrides:{"golang.org/x/text":"v0.39.0"}}' \
            > finance-n8n-task-runners-image-receipt.json
      - name: Upload task runners digest receipt
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finance-n8n-task-runners-image-receipt-${{ github.sha }}
          path: finance-n8n-task-runners-image-receipt.json
          if-no-files-found: error

  cloudflared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate locked Cloudflared source contract
        run: |
          python -m unittest tests.test_cloudflared_artifact -v
          jq -e '
            .version == "2026.7.3" and
            .source_commit == "3a2b45c2a511fcdd81b68c190938e4ffadbea5dc" and
            .source_archive_sha256 == "07a0fd9879fba3dee7affd2f8571f8759b31e226a70a91ae7a108f88d4881811" and
            .go_version == "1.26.6" and
            .runtime == "scratch" and
            .target == "linux/amd64"
          ' services/cloudflared/source-lock.json
      - name: Build source-locked Cloudflared image
        run: docker build --file services/cloudflared/Dockerfile --tag finance-cloudflared:${{ github.sha }} services/cloudflared
      - name: Smoke exact version and tunnel command contract
        run: |
          version_output="$(docker run --rm --network none finance-cloudflared:${{ github.sha }} version)"
          test "$(printf '%s\n' "$version_output" | awk '{print $3}')" = "2026.7.3"
          printf '%s\n' "$version_output" | grep -F "cloudflared version 2026.7.3"
          docker run --rm --network none finance-cloudflared:${{ github.sha }} tunnel --no-autoupdate --help >/tmp/cloudflared-tunnel-help.txt
          grep -F "cloudflared tunnel" /tmp/cloudflared-tunnel-help.txt
          set +e
          docker run --rm --network none finance-cloudflared:${{ github.sha }} tunnel --no-autoupdate run >/tmp/cloudflared-run.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Ei "requires exactly 1 argument|tunnel ID|credentials|token" /tmp/cloudflared-run.txt
      - name: Scan Cloudflared image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-cloudflared:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate Cloudflared SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: finance-cloudflared:${{ github.sha }}
          artifact-name: finance-cloudflared-${{ github.sha }}.spdx.json
      - name: Publish immutable Cloudflared candidate
        if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/finance-cloudflared:${{ github.sha }}"
          docker tag "finance-cloudflared:${{ github.sha }}" "$image"
          docker push "$image"
          immutable_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          test -n "$immutable_ref"
          jq -n --arg image "$image" --arg immutable_ref "$immutable_ref" --arg source_sha "${{ github.sha }}" '{schema_version:1,image:$image,immutable_ref:$immutable_ref,source_sha:$source_sha}' > finance-cloudflared-image-receipt.json
      - name: Upload Cloudflared digest receipt
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finance-cloudflared-image-receipt-${{ github.sha }}
          path: finance-cloudflared-image-receipt.json
          if-no-files-found: error
