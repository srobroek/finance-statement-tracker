<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101713" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cashback Control</title>
    <link rel="manifest" href="/manifest.webmanifest?v=20260817-1" />
    <link rel="apple-touch-icon" href="/app-icon.svg?v=20260817-1" />
    <link rel="stylesheet" href="/styles.css?v=20260905-2" />
  </head>
  <body data-screen-active="cards">
    <main class="shell">
      <header class="topbar"><h1>Cashback</h1><div class="top-actions"><button id="push-toggle" hidden>Alerts</button><span id="as-of">Syncing…</span></div></header>
      <nav class="screen-tabs" aria-label="View"><button data-screen-view="cards" aria-selected="true">Buckets</button><button data-screen-view="routing" aria-selected="false">Routing</button></nav>
      <section data-app-screen="cards"><div id="cards"></div>
        <details id="attention-section"><summary>Alerts</summary><div id="attention"></div></details>
        <details id="history-section"><summary>History</summary><select id="period-selector" aria-label="Previous cycle"></select><div id="period-history"></div></details>
      </section>
      <section data-app-screen="routing"><div id="recommendations"></div></section>
    </main><script src="/app.js?v=20260905-3" defer></script>
  </body>
</html>
