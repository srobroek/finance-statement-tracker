[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-statement-tracker"
version = "0.1.0"
description = "Platform-neutral finance parsing, rules, evidence, and cashback library"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.26.0",
    "pyjwt[crypto]>=2.13.0",
    "pywebpush==2.3.0",
]

[project.optional-dependencies]
statements = [
    "pdfplumber==0.11.9",
    "pypdf==6.16.1",
]
test = [
    "reportlab==4.4.9",
]

[project.scripts]
finance-toolkit = "finance_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["finance_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
