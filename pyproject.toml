[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-finance-worker"
version = "0.1.0"
description = "Notion-first deterministic finance rule and cashback worker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
finance-worker = "finance_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["finance_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

