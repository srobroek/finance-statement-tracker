services:
  cashback-control:
    image: ghcr.io/srobroek/finance-statement-tracker-cashback-control:main
    pull_policy: always
    container_name: finance-cashback-control
    restart: unless-stopped
    env_file:
      - /opt/stacks/finance-actual-poc/.env
    environment:
      TZ: Asia/Dubai
    security_opt:
      - no-new-privileges:true
    ports:
      - "5010:5010"
    volumes:
      - /opt/stacks/finance-actual-poc/cashback-data:/var/lib/cashback-control
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5010/api/health', timeout=5)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
