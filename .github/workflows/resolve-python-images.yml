name: Resolve pinned Python image candidates
on:
  pull_request:
    paths: [".github/workflows/resolve-python-images.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve official build and runtime digests
        run: |
          docker buildx imagetools inspect cgr.dev/chainguard/python:latest-dev
          docker buildx imagetools inspect cgr.dev/chainguard/python:latest
