name: Cashback container

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cashback-image.yml"
      - ".dockerignore"
      - "apps/cashback-control/**"
      - "deploy/cashback/**"
      - "deploy/actual/backup.sh"
      - "deploy/actual/sanitize-cashback-backup.py"
      - "deploy/actual/verify-backup.py"
      - "deploy/finance-runtime/**"
      - "config/actual-bootstrap.json"
      - "config/actual-note-contract.json"
      - "config/cashback-programs.json"
      - "config/cashback-profile-schema-v1.json"
      - "config/cashback-profile-schema-v2.json"
      - "config/static-rules.seed.json"
      - "config/transaction-email-sources.json"
      - "examples/cashback-profiles/**"
      - "finance_tracker/**"
      - "tests/test_cashback_workflow_release.py"
      - "tests/test_cashback_mobile_browser.py"
      - "tests/browser/cashback-mobile.mjs"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/cashback-image.yml"
      - ".dockerignore"
      - "apps/cashback-control/**"
      - "deploy/cashback/**"
      - "deploy/actual/backup.sh"
      - "deploy/actual/sanitize-cashback-backup.py"
      - "deploy/actual/verify-backup.py"
      - "deploy/finance-runtime/**"
      - "config/actual-bootstrap.json"
      - "config/actual-note-contract.json"
      - "config/cashback-programs.json"
      - "config/cashback-profile-schema-v1.json"
      - "config/cashback-profile-schema-v2.json"
      - "config/static-rules.seed.json"
      - "config/transaction-email-sources.json"
      - "examples/cashback-profiles/**"
      - "finance_tracker/**"
      - "tests/test_cashback_workflow_release.py"
      - "tests/test_cashback_mobile_browser.py"
      - "tests/browser/cashback-mobile.mjs"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the tested immutable image to the production cashback host"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: cashback-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finance-statement-tracker-cashback-control

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FINANCE_ACTUAL_RESTORE_REQUIRE_NAMESPACE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/n8n-nodes-finance/package-lock.json

      - name: Run comprehensive validation
        run: ./scripts/run-validation.sh

      - name: Upload fictional mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cashback-mobile-${{ github.sha }}
          path: artifacts/cashback-mobile/
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy fictional profile matrix
        shell: bash
        run: |
          set -euo pipefail
          docker build -f apps/cashback-control/Dockerfile -t cashback-profile-test .
          cleanup() {
            docker rm -f cashback-profile-test-run >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for profile in flat-rate-usd tiered-gbp rotating-eur requirements-cad; do
            cleanup
            docker run -d --name cashback-profile-test-run \
              -e CASHBACK_HOST=127.0.0.1 \
              -e CASHBACK_PUBLIC_URL=http://127.0.0.1:5010 \
              -e CASHBACK_INGEST_TOKEN=profile-test-token \
              -e CASHBACK_PROGRAM_CONFIG_PATH=/etc/cashback/profile.json \
              -v "$PWD/examples/cashback-profiles/${profile}.json:/etc/cashback/profile.json:ro" \
              cashback-profile-test >/dev/null
            for attempt in $(seq 1 30); do
              if docker exec cashback-profile-test-run python apps/cashback-control/probe_health.py; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker logs cashback-profile-test-run
                exit 1
              fi
              sleep 1
            done
            docker exec cashback-profile-test-run python -c \
              "import json; d=json.load(open('/var/lib/cashback-control/cashback-dashboard.json')); assert d['cards']; assert d['routing_graphs']; assert d['currency'] != 'AED'"
          done

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cashback-control/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true
    needs: publish
    permissions:
      contents: read
      packages: read
    env:
      PUBLISHED_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
    runs-on:
      - self-hosted
      - finance-ci
    steps:
      - name: Fetch exact deployment source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/finance-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$source_dir" in
            "$RUNNER_TEMP"/finance-deploy-*) ;;
            *) echo "Unsafe deployment source path: $source_dir" >&2; exit 1 ;;
          esac
          rm -rf -- "$source_dir"
          install -d "$source_dir"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$source_dir" init -q
          git -C "$source_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$source_dir" -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'DEPLOY_SOURCE=%s\n' "$source_dir" >> "$GITHUB_ENV"

      - name: Resolve tested image identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISHED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published Cashback image digest is missing or malformed" >&2
            exit 1
          fi
          image_ref="${IMAGE_NAME}@${PUBLISHED_IMAGE_DIGEST}"
          printf 'IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"

      - name: Verify private rollback snapshot before deployment changes
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          stack=/opt/stacks/finance-cashback
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backup="/opt/backups/finance-cashback/${stamp}"
          running_image_id="$(sudo docker inspect finance-cashback-control --format '{{.Image}}')"
          running_repo_digests="$(sudo docker image inspect "$running_image_id" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          mapfile -t rollback_candidates < <(
            printf '%s\n' "$running_repo_digests" |
              awk -v prefix="${IMAGE_NAME}@sha256:" 'index($0, prefix) == 1 { print }'
          )
          if (( ${#rollback_candidates[@]} != 1 )) || [[ ! "${rollback_candidates[0]}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Running Cashback image lacks one verified rollback digest" >&2
            exit 1
          fi
          rollback_image_ref="${rollback_candidates[0]}"
          sudo install -d -m 0700 /opt/backups/finance-cashback
          # A failed snapshot deliberately leaves the writer stopped.
          sudo docker stop finance-cashback-control >/dev/null
          sudo python3 deploy/cashback/predeploy-backup.py \
            --destination "$backup" --image-reference "$rollback_image_ref"
          printf 'CASHBACK_ROLLBACK_BACKUP=%s\n' "$backup" >> "$GITHUB_ENV"

      - name: Install matching deployment configuration after verified backup
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          stack=/opt/stacks/finance-cashback
          test -n "$CASHBACK_ROLLBACK_BACKUP"
          sudo test -f "$CASHBACK_ROLLBACK_BACKUP/verification.json"
          sudo install -d -m 0700 /opt/stacks/finance-runtime
          sudo install -m 0600 deploy/finance-runtime/finance.env.tpl /opt/stacks/finance-runtime/.env.tpl
          sudo install -m 0750 deploy/finance-runtime/render-env.sh /opt/stacks/finance-runtime/render-env.sh
          sudo /opt/stacks/finance-runtime/render-env.sh
          sudo install -m 0644 config/cashback-programs.json "$stack/cashback-profile.json"
          sudo install -m 0644 config/actual-bootstrap.json "$stack/actual-bootstrap.json"
          sudo install -m 0644 config/static-rules.seed.json "$stack/static-rules.json"
          sudo install -m 0644 config/transaction-email-sources.json "$stack/transaction-email-sources.json"
          printf 'CASHBACK_DATA_DIR=/opt/stacks/finance-actual/cashback-data\nCASHBACK_IMAGE=%s\n' \
            "$IMAGE_REF" | sudo tee "$stack/.env" >/dev/null

      - name: Authenticate and pull tested image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          auth_dir="$RUNNER_TEMP/finance-docker-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$auth_dir"
          install -d -m 0700 "$auth_dir"
          cleanup_auth() {
            sudo env DOCKER_CONFIG="$auth_dir" REGISTRY_AUTH_FILE="$auth_dir/auth.json" \
              docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$auth_dir"
          }
          trap cleanup_auth EXIT
          printf '%s' "$GHCR_TOKEN" | sudo env DOCKER_CONFIG="$auth_dir" REGISTRY_AUTH_FILE="$auth_dir/auth.json" \
            docker login \
            ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          sudo env DOCKER_CONFIG="$auth_dir" REGISTRY_AUTH_FILE="$auth_dir/auth.json" \
            docker pull "$IMAGE_REF"
          sudo install -m 0644 deploy/cashback/compose.yaml /opt/stacks/finance-cashback/compose.yaml
          cd /opt/stacks/finance-cashback
          # This project owns only cashback; it cannot touch Actual or its
          # ingestion worker.
          sudo docker compose -p finance-cashback up -d --pull never --force-recreate cashback-control

      - name: Verify live deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if sudo docker exec finance-cashback-control python apps/cashback-control/probe_health.py >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo docker compose -p finance-cashback \
                -f /opt/stacks/finance-cashback/compose.yaml logs --tail=100 cashback-control
              exit 1
            fi
            sleep 2
          done
          image="$(sudo docker inspect finance-cashback-control --format '{{.Config.Image}}')"
          test "$image" = "$IMAGE_REF"
          image_id="$(sudo docker inspect finance-cashback-control --format '{{.Image}}')"
          repo_digests="$(sudo docker image inspect "$image_id" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          resolved="$(printf '%s\n' "$repo_digests" | awk -v expected="$IMAGE_REF" '$0 == expected { found += 1 } END { if (found != 1) exit 1; print expected }')"
          test "$resolved" = "$IMAGE_REF"
          sudo docker exec finance-cashback-control python -c \
            "import json; d=json.load(open('/var/lib/cashback-control/cashback-dashboard.json')); assert d['cards']; assert d['routing_graphs']"
          curl -fsS http://127.0.0.1:5006/ >/dev/null
