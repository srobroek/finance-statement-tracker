name: Cashback container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/cashback-image.yml"
      - ".dockerignore"
      - "apps/cashback-control/**"
      - "config/actual-bootstrap.json"
      - "config/cashback-programs.json"
      - "config/static-rules.seed.json"
      - "finance_tracker/**"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cashback-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finance-statement-tracker-cashback-control

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cashback-control/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
