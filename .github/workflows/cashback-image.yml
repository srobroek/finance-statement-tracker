name: Cashback container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/cashback-image.yml"
      - ".dockerignore"
      - "apps/cashback-control/**"
      - "config/actual-bootstrap.json"
      - "config/cashback-programs.json"
      - "config/static-rules.seed.json"
      - "finance_tracker/**"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cashback-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finance-statement-tracker-cashback-control

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install ".[statements,test]"

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cashback-control/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on:
      - self-hosted
      - finance-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Back up cashback state and Dockge configuration
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          sudo docker exec finance-cashback-control python -c \
            "import sqlite3; source=sqlite3.connect('/var/lib/cashback-control/cashback-events.sqlite3'); target=sqlite3.connect('/var/lib/cashback-control/pre-deploy-${stamp}.sqlite3'); source.backup(target); target.close(); source.close()"
          sudo cp /opt/stacks/finance-actual-poc/compose.yaml \
            "/opt/stacks/finance-actual-poc/compose.yaml.pre-${stamp}"
          sudo install -m 0755 deploy/actual-poc/stack-watchdog.sh \
            /opt/stacks/finance-actual-poc/stack-watchdog.sh
          sudo install -m 0644 deploy/actual-poc/finance-stack-watchdog.service \
            /etc/systemd/system/finance-stack-watchdog.service
          sudo install -m 0644 deploy/actual-poc/finance-stack-watchdog.timer \
            /etc/systemd/system/finance-stack-watchdog.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now finance-stack-watchdog.timer

      - name: Authenticate and pull tested image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_file=/root/.config/containers/finance-ghcr-auth.json
          sudo mkdir -p "$(dirname "$auth_file")"
          printf '%s' "$GHCR_TOKEN" | sudo podman login \
            --authfile "$auth_file" \
            ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          sudo podman pull --authfile "$auth_file" "$IMAGE_NAME:main"
          sudo install -m 0644 deploy/actual-poc/compose.yaml /opt/stacks/finance-actual-poc/compose.yaml
          cd /opt/stacks/finance-actual-poc
          # The Podman Compose provider may leave sibling services exited when
          # only one service is targeted. Always converge the complete finance
          # stack so a cashback release cannot take Actual or its proxy down.
          sudo docker compose up -d --no-deps --pull never \
            actual actual-proxy cashback-control actual-ingestion
          sudo podman logout --authfile "$auth_file" ghcr.io
          sudo rm -f "$auth_file"

      - name: Verify live deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5010/api/health | grep -q '"status": "ok"' && \
               curl -fsS http://127.0.0.1:5020/api/health | grep -q '"status": "ok"' && \
               curl -fsS http://127.0.0.1:5006/ >/dev/null && \
               test "$(sudo docker inspect finance-actual-proxy --format '{{.State.Health.Status}}')" = healthy && \
               test "$(sudo docker inspect finance-cashback-control --format '{{.State.Health.Status}}')" = healthy && \
               test "$(sudo docker inspect finance-actual-ingestion --format '{{.State.Health.Status}}')" = healthy; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo docker compose -f /opt/stacks/finance-actual-poc/compose.yaml logs --tail=100 \
                actual actual-proxy cashback-control actual-ingestion
              exit 1
            fi
            sleep 2
          done
          image="$(sudo docker inspect finance-cashback-control --format '{{.Config.Image}}')"
          test "$image" = "$IMAGE_NAME:main"
          curl -fsS http://127.0.0.1:5010/api/dashboard >/dev/null
          curl -fsS http://127.0.0.1:5006/ >/dev/null
