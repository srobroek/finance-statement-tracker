name: Cashback container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/cashback-image.yml"
      - ".dockerignore"
      - "apps/cashback-control/**"
      - "deploy/cashback/**"
      - "deploy/finance-runtime/**"
      - "config/actual-bootstrap.json"
      - "config/actual-note-contract.json"
      - "config/cashback-programs.json"
      - "config/cashback-profile-schema-v1.json"
      - "config/static-rules.seed.json"
      - "config/transaction-email-sources.json"
      - "examples/cashback-profiles/**"
      - "finance_tracker/**"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cashback-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finance-statement-tracker-cashback-control

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install ".[statements,test]"

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Deploy fictional profile matrix
        shell: bash
        run: |
          set -euo pipefail
          docker build -f apps/cashback-control/Dockerfile -t cashback-profile-test .
          cleanup() {
            docker rm -f cashback-profile-test-run >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for profile in flat-rate-usd tiered-gbp rotating-eur requirements-cad; do
            cleanup
            docker run -d --name cashback-profile-test-run \
              -e CASHBACK_PROGRAM_CONFIG_PATH=/etc/cashback/profile.json \
              -v "$PWD/examples/cashback-profiles/${profile}.json:/etc/cashback/profile.json:ro" \
              cashback-profile-test >/dev/null
            for attempt in $(seq 1 30); do
              if docker exec cashback-profile-test-run python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5010/api/health', timeout=2)"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker logs cashback-profile-test-run
                exit 1
              fi
              sleep 1
            done
            docker exec cashback-profile-test-run python -c \
              "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:5010/api/dashboard')); assert d['cards']; assert d['routing_graphs']; assert d['currency'] != 'AED'"
          done

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cashback-control/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on:
      - self-hosted
      - finance-ci
    steps:
      - name: Fetch exact deployment source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/finance-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$source_dir" in
            "$RUNNER_TEMP"/finance-deploy-*) ;;
            *) echo "Unsafe deployment source path: $source_dir" >&2; exit 1 ;;
          esac
          rm -rf -- "$source_dir"
          install -d "$source_dir"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$source_dir" init -q
          git -C "$source_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$source_dir" -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'DEPLOY_SOURCE=%s\n' "$source_dir" >> "$GITHUB_ENV"

      - name: Back up cashback state and Dockge configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          stack=/opt/stacks/finance-cashback
          sudo install -d "$stack"
          sudo install -d -m 0700 /opt/stacks/finance-runtime
          sudo install -m 0600 deploy/cashback/cashback.env.tpl "$stack/.env.tpl"
          sudo install -m 0750 deploy/finance-runtime/render-env.sh /opt/stacks/finance-runtime/render-env.sh
          sudo env FINANCE_RUNTIME_DIR="$stack" /opt/stacks/finance-runtime/render-env.sh
          sudo install -m 0644 config/cashback-programs.json "$stack/cashback-profile.json"
          sudo install -m 0644 config/actual-bootstrap.json "$stack/actual-bootstrap.json"
          sudo install -m 0644 config/static-rules.seed.json "$stack/static-rules.json"
          sudo install -m 0644 config/transaction-email-sources.json "$stack/transaction-email-sources.json"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if sudo docker ps --format '{{.Names}}' | grep -Fxq finance-cashback-control; then
            sudo docker exec finance-cashback-control python -c \
              "import sqlite3; source=sqlite3.connect('/var/lib/cashback-control/cashback-events.sqlite3'); target=sqlite3.connect('/var/lib/cashback-control/pre-deploy-${stamp}.sqlite3'); source.backup(target); target.close(); source.close()"
          elif sudo test -f /opt/stacks/finance-actual-poc/cashback-data/cashback-events.sqlite3; then
            sudo cp --preserve=mode,timestamps \
              /opt/stacks/finance-actual-poc/cashback-data/cashback-events.sqlite3 \
              "/opt/stacks/finance-actual-poc/cashback-data/pre-deploy-${stamp}.sqlite3"
          fi

      - name: Authenticate and pull tested image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_SOURCE"
          auth_file=/root/.config/containers/finance-ghcr-auth.json
          sudo mkdir -p "$(dirname "$auth_file")"
          printf '%s' "$GHCR_TOKEN" | sudo podman login \
            --authfile "$auth_file" \
            ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          sudo podman pull --authfile "$auth_file" "$IMAGE_NAME:main"
          sudo install -m 0644 deploy/cashback/compose.yaml /opt/stacks/finance-cashback/compose.yaml
          cd /opt/stacks/finance-cashback
          # This project owns only cashback; it cannot touch Actual or its
          # ingestion worker.
          sudo podman rm -f finance-cashback-control 2>/dev/null || true
          sudo docker compose -p finance-cashback up -d --pull never cashback-control
          sudo podman logout --authfile "$auth_file" ghcr.io
          sudo rm -f "$auth_file"

      - name: Verify live deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5010/api/health | grep -q '"status": "ok"'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo docker compose -p finance-cashback \
                -f /opt/stacks/finance-cashback/compose.yaml logs --tail=100 cashback-control
              exit 1
            fi
            sleep 2
          done
          image="$(sudo docker inspect finance-cashback-control --format '{{.Config.Image}}')"
          test "$image" = "$IMAGE_NAME:main"
          curl -fsS http://127.0.0.1:5010/api/dashboard >/dev/null
          curl -fsS http://127.0.0.1:5006/ >/dev/null
